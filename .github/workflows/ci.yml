name: CI

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# npm workspaces: install once at the repository root; web consumes packages/core (@bj/core).
jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -w web
      - run: npm run typecheck -w web
      - run: npm test -w web

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w web
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Run Lighthouse CI
        working-directory: web
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
