name: Standards

# Runs on EVERY pull request (no path filter) so the engineering standards cannot be skipped.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Lint, format, typecheck, boundaries, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run deps:check
      - run: npm run licenses:check

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-commits.mjs "origin/${{ github.base_ref }}" HEAD

  tests:
    name: Typecheck + test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # web is covered by ci.yml; core, api and worker by the workspace-tests job below.
        dir: [rooms, crawler]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  audit:
    name: npm audit (high+) ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: ".", flags: "" }
          # Ratchet: rooms/crawler dev-only vitest 3 -> tinypool (critical, test runner only, no prod exposure).
          # Gate production deps now; drop `--omit=dev` when vitest is bumped to 5 (own PR).
          - { dir: rooms, flags: "--omit=dev" }
          - { dir: crawler, flags: "--omit=dev" }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high ${{ matrix.flags }}

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workspace-tests:
    name: Workspace tests (core, data, edge, api, worker) + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-throwaway@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/check-migrations.mjs
      - name: Generated database types are up to date
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run cli -w @bj/api -- migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run generate -w @bj/db-types
          git diff --exit-code -- packages/db-types
      - run: npm test -w @bj/core -- --coverage
      - run: npm test -w @bj/api -- --coverage
      - run: npm test -w @bj/worker -- --coverage
      - name: Migration files are immutable once on main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node scripts/check-migrations.mjs "origin/${{ github.base_ref }}"
      - run: npm test -w @bj/data -- --coverage
      - run: npm test -w @bj/edge -- --coverage
      - name: OpenAPI document is generated from the routes and v1 stays additive
        run: |
          npm run openapi -w @bj/api
          git diff --exit-code -- api/openapi.v1.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            if git cat-file -e "origin/${{ github.base_ref }}:api/openapi.v1.json" 2>/dev/null; then
              git show "origin/${{ github.base_ref }}:api/openapi.v1.json" > /tmp/openapi-baseline.json
              npm run openapi:compat -w @bj/api -- /tmp/openapi-baseline.json
            fi
          fi
